<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FamilySphere - منصة العائلة العالمية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Tahoma, sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; text-align: center; padding: 20px; margin: 0; }
        .card { background: rgba(255,255,255,0.1); backdrop-filter:blur(10px); border-radius: 15px; padding: 20px; margin-top: 20px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37); }
        h1 { font-size: 22px; color: #4cd137; }
        p { font-size: 14px; line-height: 1.6; }
        .btn { background: #4cd137; color: #fff; border: none; padding: 12px 20px; border-radius: 25px; font-size: 16px; font-weight: bold; margin-top: 15px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <h1>FamilySphere - منصة العائلة العالمية</h1>
    <div class="card">
        <h3>🌐 النظام نشط وجاهز</h3>
        <p>تم تفعيل منصة العائلة العالمية بنجاح لاستقبال الزوار وتتبع الأداء.</p>
        <button class="btn" onclick="alert('أهلاً بك في FamilySphere - النظام يعمل بكفاءة تامة!')">دخول المنصة</button>
    </div>
</body>
</html>
